      </div>
    </div>

    <!-- META STRIP: same MG, equal left/right padding -->
    <div style="margin:${px(20)} ${px(MG)} 0;background:#FCFBF8;border-radius:${px(12)};padding:${px(7)} ${px(16)};flex-shrink:0">
      <div style="display:flex;align-items:center;justify-content:space-between">

        <!-- RULESET -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:${px(3)}">
          <span style="font-size:${px(5.5)};font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6E6560">RULESET</span>
          <div style="display:inline-flex;align-items:center;border:.75px solid #1C1D1F;border-radius:15px;padding:${px(3)} ${px(10)}">
            <span style="font-size:${px(7.5)};font-weight:500;color:#1C1D1F;white-space:nowrap">${esc(D.ruleset)}</span>
          </div>
        </div>

        <!-- ISSUED -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:${px(3)}">
          <span style="font-size:${px(5.5)};font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6E6560">ISSUED</span>
          <span style="font-size:${px(9)};font-weight:600;color:#1C1D1F;white-space:nowrap;letter-spacing:.02em">${esc((D.issued||'').toUpperCase())}</span>
        </div>

        <!-- AURA CASE: plain text, no border, doesn't set strip width -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:${px(3)}">
          <span style="font-size:${px(5.5)};font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6E6560">AURA CASE</span>
          <span style="font-family:'DM Mono',monospace;font-size:${px(8.5)};font-weight:500;color:#D75A36;white-space:nowrap">${esc(D.case_id)}</span>
        </div>

        <!-- BLOCKCHAIN ANCHOR: same treatment -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:${px(3)}">
          <span style="font-size:${px(5.5)};font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6E6560">BLOCKCHAIN ANCHOR</span>
          ${anchorPill}
        </div>

      </div>
    </div>

  </div><!-- end body -->

  <!-- ③ FOOTER: flex-shrink:0, same MG, legal + pill -->
  <div style="padding:${px(6)} ${px(MG)} ${px(22)};flex-shrink:0">
    <p style="font-size:${px(5.5)};line-height:1.55;text-align:justify;color:#6E6560;hyphens:auto;margin-bottom:${px(7)}">${legal}</p>
    <div style="display:flex;justify-content:flex-end">
      <a href="https://auracertificate.art/verify/${esc(D.case_id)}" target="_blank"
         style="display:inline-flex;align-items:center;border:.75px solid rgba(28,29,31,.4);border-radius:100px;padding:${px(4)} ${px(12)};font-size:${px(7.5)};font-weight:600;color:#1C1D1F;letter-spacing:.06em;text-transform:uppercase;text-decoration:none">
        AURACERTIFICATE.ART →
      </a>
    </div>
  </div>

</div>`;
}

render();

</script>
</body>
</html>
