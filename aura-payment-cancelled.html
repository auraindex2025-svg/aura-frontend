<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Payment not completed — AURA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,200;1,9..40,400&family=DM+Mono:wght@300;400;500&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1D1F;--ash:#6E6560;--linen:#E8E3DA;
  --cream:#F5F0E8;--white:#FAFAF8;--paper:#FFFAF3;
  --rust:#D75A36;--red:#D32A37;--amber:#C47A10;
  --border:#D5CFC6;
  --bg:var(--cream);--fg:var(--ink);
  --card:var(--white);
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --accent:'Monsieur La Doulaise',cursive;
  --r:.5rem;--rl:calc(var(--r)*1.5);--rxl:calc(var(--r)*2);--r2xl:2.5rem;--rpill:9999px;
  --ease:cubic-bezier(.16,1,.3,1);--fast:180ms;--base:300ms;--slow:500ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--ink);color:var(--cream)}

/* ── Isotipo bleeding ─────────────────────────────────────────────────── */
.brand-mark{position:fixed;top:6vh;left:-26vw;width:96vw;max-width:1180px;z-index:0;pointer-events:none;user-select:none}
.brand-mark svg{display:block;width:100%;height:auto;fill:var(--paper)}
@media(max-width:860px){.brand-mark{top:10vh;left:-48vw;width:130vw}}

/* ── App shell ────────────────────────────────────────────────────────── */
.app{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}

/* ── Header ───────────────────────────────────────────────────────────── */
.header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.5rem 1.75rem 1rem;position:relative;z-index:60}
.header-logo{display:flex;align-items:center;gap:10px}
.logo-svg{display:block;height:22px;width:auto;fill:var(--ink);stroke:var(--ink)}
.logo-sub{font-size:11px;font-weight:400;line-height:1.25;color:var(--ash);border-left:1px solid var(--border);padding-left:10px}
.header-badge{display:inline-flex;align-items:center;border:.75px solid var(--ink);border-radius:var(--rpill);padding:4px 12px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap}

/* ── Main ─────────────────────────────────────────────────────────────── */
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.75rem;position:relative;z-index:1}
.container{max-width:520px;width:100%;margin:0 auto}

/* ── Card ─────────────────────────────────────────────────────────────── */
.card{
  background:var(--card);border-radius:var(--r2xl);
  border:1px solid var(--border);
  padding:3rem 3.5rem;
  opacity:0;animation:up var(--base) .05s var(--ease) both;
  text-align:center;
}
@media(max-width:560px){.card{padding:2rem 1.5rem;border-radius:var(--rxl)}}

/* ── Icon ─────────────────────────────────────────────────────────────── */
.icon-wrap{
  width:64px;height:64px;border-radius:50%;
  background:rgba(196,122,16,.07);border:1.5px solid rgba(196,122,16,.22);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 1.75rem;
  opacity:0;animation:scale var(--slow) .15s var(--ease) both;
}
.icon-wrap svg{width:28px;height:28px;stroke:var(--amber)}

/* ── Typography ───────────────────────────────────────────────────────── */
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-bottom:.5rem}
.subtitle{font-size:.9375rem;color:var(--ash);margin-bottom:2rem;line-height:1.55}

/* ── Case ID (display only, no copy needed here) ─────────────────────── */
.case-id{
  font-family:var(--mono);font-size:.9375rem;font-weight:600;
  color:var(--ink);background:var(--linen);border-radius:var(--rl);
  padding:.625rem 1.25rem;display:inline-block;margin-bottom:2rem;letter-spacing:.06em;
  border:1px solid var(--border);
}

/* ── Note panel ───────────────────────────────────────────────────────── */
.note{
  background:var(--paper);border-radius:var(--rxl);border:1px solid var(--border);
  padding:1.25rem 1.5rem;margin-bottom:2rem;text-align:left;
  font-size:.875rem;color:var(--ash);line-height:1.65;
}
.note strong{color:var(--ink);font-weight:600}
.note a{color:var(--ink);font-weight:600}

/* ── Actions ──────────────────────────────────────────────────────────── */
.actions{display:flex;flex-direction:column;gap:.75rem}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.75rem 1.5rem;border-radius:var(--rpill);
  font-family:var(--sans);font-size:.9375rem;font-weight:600;
  cursor:pointer;transition:opacity var(--fast),transform var(--fast);
  border:none;text-decoration:none;
}
.btn:active{transform:scale(.98);opacity:.85}
.btn-primary{background:var(--ink);color:var(--cream)}
.btn-secondary{background:transparent;color:var(--ink);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--ink)}

/* ── Footer ───────────────────────────────────────────────────────────── */
.footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;padding:1.5rem 1.75rem;font-size:12px;color:var(--ash)}
.footer a{color:var(--ash);text-decoration:none}
.footer a:hover{color:var(--ink)}

/* ── Animations ───────────────────────────────────────────────────────── */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes scale{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-logo">
      <svg class="logo-svg" viewBox="0 0 1243.09 547.51" aria-label="aura" xmlns="http://www.w3.org/2000/svg"><path d="M394.3,221.59V45.76h47.71v175.83c0,57.93,33.39,92,83.83,92s83.83-34.08,83.83-92V45.76h47.71v175.83c0,74.97-42.94,138.35-131.53,138.35s-131.53-63.38-131.53-138.35Z"/><path d="M735.72,353.34V39.16h43.62v56.57c13.63-33.39,51.79-56.57,94.73-56.57h21.13v48.39h-21.13c-56.57,0-90.64,40.21-90.64,96.09v169.7h-47.71Z"/><path d="M937.69,256.8c0-53.26,43.28-87.22,100.53-87.22h71.91c21.97,0,35.95-13.32,35.95-31.96,0-23.3-25.3-53.26-76.57-53.26-45.27,0-71.91,24.63-84.56,57.26l-36.62-23.97c18.64-44.61,57.92-78.56,121.17-78.56,77.9,0,125.17,50.6,125.17,111.19v195.74h-42.61v-43.94c-9.32,21.31-46.61,51.27-97.87,51.27-70.58,0-116.51-43.28-116.51-96.54ZM1148.08,214.85v-3.99h-109.19c-30.63,0-51.27,19.31-51.27,45.94,0,27.96,23.3,51.27,66.58,51.27,59.26,0,93.88-37.95,93.88-93.21Z"/><path fill="none" stroke="inherit" stroke-miterlimit="10" stroke-width="54" d="M51.16,143.19c-1.97-42.3,34.92-78.41,71.1-91.16,105.71-37.26,192.98,49.53,183.85,157.14-9.1,107.19-191.62,198.16-233.59,89-26.76-69.6,68.59-136.14,133.37-59.37,33.9,40.17,62.67,84.28,92.4,127.16,40.17,55.4,82.51,156.19,166.52,138.64,78.57-16.42,80.22-119.21,28.4-154.62-92.49-63.21-163.19,39.86-220.46,103-78.57,86.61-224.35,71.16-224.35-41.87"/></svg>
      <div class="logo-sub">creative origin<br>certificate</div>
    </div>
    <span class="header-badge">Payment</span>
  </header>

  <main class="main">
    <div class="container">
      <div class="card">

        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>

        <h1 id="heading">Payment not completed</h1>
        <p class="subtitle" id="subtitle">You left before completing the payment. No charge has been made.</p>

        <!-- Case ID shown if present, for reference only -->
        <div id="case-id-wrap" style="display:none">
          <div class="case-id" id="case-id"></div>
        </div>

        <div class="note" id="note"></div>

        <div class="actions" id="actions"></div>

      </div>

  </main>

  <footer class="footer">
    <span>© 2026 AURA</span>

  </footer>
</div>

<script>
const LANG = (navigator.language || 'en').startsWith('es') ? 'es' : 'en';
const T = {
  en: {
    heading:  'Payment not completed',
    subtitle: 'You left before completing the payment. No charge has been made.',
    note: `<strong>Your submission is safe.</strong> Your case has been saved. When you're ready to complete the payment, write to us at <a href="mailto:hello@auracertificate.art">hello@auracertificate.art</a> with your case ID and we'll send you a direct checkout link.`,
    noteInst: `<strong>Your case is saved.</strong> No invitation has been sent to the artist yet — that only happens once payment is confirmed. Write to us at <a href="mailto:hello@auracertificate.art">hello@auracertificate.art</a> with your case ID to receive a direct checkout link.`,
    newSub:  'Start a new submission',
    support: 'Contact support',
  },
  es: {
    heading:  'Pago no completado',
    subtitle: 'Saliste antes de completar el pago. No se ha realizado ningún cargo.',
    note: `<strong>Tu envío está guardado.</strong> Tu caso está a salvo. Cuando quieras completar el pago, escríbenos a <a href="mailto:hello@auracertificate.art">hello@auracertificate.art</a> con tu número de caso y te enviamos un enlace de pago directo.`,
    noteInst: `<strong>Tu caso está guardado.</strong> La invitación al artista aún no se ha enviado — eso ocurre solo tras confirmar el pago. Escríbenos a <a href="mailto:hello@auracertificate.art">hello@auracertificate.art</a> con tu número de caso para recibir un enlace de pago directo.`,
    newSub:  'Iniciar un nuevo envío',
    support: 'Contactar soporte',
  },
};
const t = k => T[LANG][k] || T.en[k];

function boot() {
  const params        = new URLSearchParams(location.search);
  const caseId        = params.get('case_id');
  const isInstitution = params.get('type') === 'institution';

  document.getElementById('heading').textContent  = t('heading');
  document.getElementById('subtitle').textContent = t('subtitle');
  document.getElementById('note').innerHTML = isInstitution ? t('noteInst') : t('note');

  if (caseId) {
    document.getElementById('case-id').textContent = caseId;
    document.getElementById('case-id-wrap').style.display = '';
  }

  const actions = document.getElementById('actions');
  const freshUrl = isInstitution ? '/institutional' : '/submit';
  actions.innerHTML = `
    <a class="btn btn-primary" href="${freshUrl}">${t('newSub')}</a>
    <a class="btn btn-secondary" href="mailto:hello@auracertificate.art">${t('support')}</a>
  `;
}

boot();
</script>
